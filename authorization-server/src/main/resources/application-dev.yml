server:
  port: 9000
  servlet:
    context-path: /unicorn-oauth2

spring:
  application:
    name: unicorn-oauth2
  config:
    import:
      - optional:nacos:unicorn-oauth2.yaml
  cloud:
    nacos:
      server-addr: nacos.zj-hanson.com:8848
      username: dev
      password: nacos
      discovery:
        namespace: @nacos.namespace@
        port: 9000
      config:
        file-extension: yaml
        namespace: @nacos.namespace@
        refresh-enabled: true
    inetutils:
      preferred-networks: 172.16